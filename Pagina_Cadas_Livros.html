                </div>

                <div class="nomes">

                    <select id="estado" name="usuario_estado">

                    </select>

                <div class="nomes">
                    <h2>Adicione a imagem:</h2>
                        <input type="file" id="imgLivros" name="imgem_Livros">

                
                            <h2>Descrição:</h2>

                </div>

                <div class="nomes">
                    <h2>Data da devolução</h2>
                    <input type="date" id="nascimento" name="data_nascimento">
                </div>

            

                <input type="submit" value="Enviar Cadastro">
            

                </form>
