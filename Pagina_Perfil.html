<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="Estilo.css">
</head>

<body>

    <header class="cabecalhoInicial">

        <form action="">
            <input type="search" name="principalCaixa" id="principalCaixa">
        </form>

        <img src="./Imagens/foto_perfil.jpg" alt="Foto de perfil">

    </header>

    <div class="container">

        <section class="cadasrtros perfilPagina">

            <div class="imagemPerfil">
                <img src="./Imagens/foto_perfil.jpg" alt="Imagem de perfil">
            </div>

            <div class="perfil">
                <h3>Nome</h3>
                <input type="search" name="nome" id="nome">
            </div>

            <div class="perfil">
                <h3>Email</h3>
                <input type="search" name="email" id="email">
            </div>

            <div class="perfil">
                <h3>Histórico de empréstimos</h3>
                <textarea id="emprestimos" name="emprestimos"
                    placeholder="Histórico..."></textarea>
            </div>

            <div class="perfil">
                <h3>Multas a pagar</h3>
                <textarea id="multas" name="multas"
                    placeholder="Multas..."></textarea>
            </div>

        </section>

    </div>

</body>
</html>
